      <stop offset="0%" stop-color="#5fc7ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5fc7ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#4e86c9" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>

