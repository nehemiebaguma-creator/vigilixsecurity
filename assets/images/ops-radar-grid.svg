<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">VIGILANCE OPS Radar Grid</title>
  <desc id="desc">Futuristic radar interface with blue command rings, red alert zones and VIGILANCE technical side panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050913"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <radialGradient id="blueCore" cx="50%" cy="58%" r="34%">
