<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 132" role="img" aria-labelledby="title desc">
  <title id="title">VIGILANCE Security</title>
  <desc id="desc">Horizontal VIGILANCE Security wordmark with the night watch slogan.</desc>
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061525"/>
      <stop offset=".58" stop-color="#0a2139"/>
      <stop offset="1" stop-color="#02070f"/>
    </linearGradient>
    <linearGradient id="steel" x1="18" y1="10" x2="74" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6fbff"/>
      <stop offset=".44" stop-color="#58c8ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <radialGradient id="iris" cx="46" cy="46" r="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4f4ff"/>
      <stop offset=".5" stop-color="#35beff"/>
      <stop offset="1" stop-color="#173f9e"/>
    </radialGradient>
    <linearGradient id="gold" x1="20" y1="14" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8d4"/>
      <stop offset="1" stop-color="#f7c65f"/>
    </linearGradient>
    <linearGradient id="textFill" x1="120" y1="20" x2="474" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#e6f5ff"/>
      <stop offset="1" stop-color="#7ddcff"/>
    </linearGradient>
    <linearGradient id="wordPanel" x1="112" y1="16" x2="502" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071626"/>
      <stop offset=".58" stop-color="#0a2a47"/>
      <stop offset="1" stop-color="#04101d"/>
    </linearGradient>
    <filter id="panelShadow" x="88" y="0" width="438" height="150" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00142b" flood-opacity=".28"/>
    </filter>
  </defs>

  <g transform="translate(8 18)">
    <rect width="92" height="92" rx="22" fill="url(#markBg)"/>
    <circle cx="46" cy="26" r="38" fill="#2bb7ff" opacity=".14"/>
    <path d="M46 8c13 0 24 4 34 11v20c0 21-13 38-34 47C25 77 12 60 12 39V19C22 12 33 8 46 8z" fill="#eef7ff"/>
    <path d="M46 12c11 0 21 3 30 9v18c0 18-11 34-30 42-19-8-30-24-30-42V21c9-6 19-9 30-9z" fill="#071626" stroke="url(#steel)" stroke-width="3"/>
    <path fill-rule="evenodd" d="M43 18a7 7 0 1 0 0 14 10 10 0 1 1 0-14z" fill="url(#gold)"/>
    <path d="M23 45c7-9 15-14 23-14s16 5 23 14c-7 9-15 14-23 14s-16-5-23-14z" fill="#0b1e31" stroke="#9be8ff" stroke-width="3"/>
    <circle cx="46" cy="45" r="11" fill="url(#iris)"/>
    <circle cx="46" cy="45" r="4.5" fill="#04111f"/>
    <circle cx="50" cy="41" r="2" fill="#fff"/>
    <path d="M32 65l14 18 14-18" fill="none" stroke="url(#steel)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="112" y="16" width="390" height="110" rx="24" fill="url(#wordPanel)" stroke="#2388c9" stroke-opacity=".36"/>
    <path d="M128 110h164" stroke="#f4c866" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g fill="url(#textFill)">
    <text x="122" y="62" font-family="Montserrat, Avenir Next, Trebuchet MS, Arial, sans-serif" font-size="42" font-weight="900">VIGILANCE</text>
    <text x="125" y="91" font-family="Montserrat, Avenir Next, Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" fill="#73d9ff">SECURITY</text>
  </g>
  <text x="123" y="124" font-family="Montserrat, Avenir Next, Trebuchet MS, Arial, sans-serif" font-size="15" font-weight="650" fill="#d7ecff">Quand tout le monde dort, VIGILANCE veille.</text>
</svg>
